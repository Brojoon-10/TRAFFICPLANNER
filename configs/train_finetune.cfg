# Fine-tuning config for Agent Cross-Attention Training
# Uses JSON scenario pairs from adv_gen output

# save options
out: ./out/train_traffic_out/train_finetune_out

# data options
data_dir: ./data/nuscenes
data_version: trainval
batch_size: 4

# Scenario directory (JSON files from adv_gen)
scenario_dir: ./data/fine_tuning/agent_attention_training_v1

# Sequence config (must match adv_gen output)
past_len: 4
future_len: 12
dt: 0.5

# Pretrained checkpoint (REQUIRED)
# ckpt: ./out/train_traffic_out/checkpoints_boston/best_eval_model_trans_decoder_changed.pth
ckpt: ./out/train_traffic_out/checkpoints_boston/best_eval_model_transCVAE.pth


# Training options
epochs: 1000
lr: 1e-5

# Normal pair loss weights (recon + collision)
normal_loss_recon: 1.0
normal_loss_coll_veh: 0.05
normal_loss_coll_env: 1.0

# Adv pair loss weights (collision only, no recon)
# coll scaled up to balance with recon (~4.0) in normal loss

# adv_loss_recon: 0.0
# adv_loss_coll_veh: 50.0
# adv_loss_coll_env: 50.0

adv_loss_recon: 0.0
adv_loss_coll_veh: 25.0
adv_loss_coll_env: 25.0

# Overall loss weighting
normal_weight: 1.0
adv_weight: 1.0
