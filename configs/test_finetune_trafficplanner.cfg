# Test Fine-tuned TrafficPlanner Configuration
# Uses FinetuneTrafficPlannerDataset with data_types selection

# Output
out: ./out/test_finetune_trafficplanner_out_both

# GPU
gpu: 0

# Fine-tuning data
scenario_dir: ./data/fine_tuning/trafficplanner_fine_tune_dataset/scenario_results/adv_sol_success

# Data type selection: 'both', 'normal', 'adv_sol'
data_types: adv_sol

# Test split: 'train' or 'val'
test_split: val

# Checkpoint (fine-tuned model)
ckpt: ./out/finetune_trafficplanner_out/checkpoints_finetune/best_finetune_model.pth

# Sequence parameters (must match training)
past_len: 4
future_len: 12
dt: 0.5

# Architecture (must match training)
past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9
sur_pred_dim: 2
map_recrop: True

# Transformer decoder params (must match training)
trans_num_layers: 4
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 512
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: False

# Batch
batch_size: 4
num_workers: 4

# sur_gt_replay is auto-set: adv_sol → True, normal/both → False

shuffle_test: False

# Latent analysis (z_global, z_local, attention weights per scene)
test_latent_analysis: True

# Test options
test_recon_viz_multi: True
test_recon_coll_rate: False
test_sample_viz_multi: False
test_sample_viz_rollout: False
test_sample_disp_err: False
test_sample_coll_rate: False
test_sample_num: 3
make_video: False
