# out: ./out/adv_gen_replay_out_boston_trans_500_ego_prior_pred
out: ./out/adv_gen_replay_out_boston_transCVAE_fine_tuned


# data options
data_dir: ./data/nuscenes
data_version: trainval

# split: val
split: adv

start_num : 0

val_size: 400 # num scenes

seq_interval: 100 # one scene for one data
# seq_interval : 10 # original
# seq_interval: 1 

shuffle: False
num_workers: 0
batch_size: 1 # sets the approximate num agents across all scenes being optimized

# past_len: 20
# future_len: 60
# dt : 0.1

# past_len: 10
# future_len: 30
# dt : 0.25

past_len: 4
future_len: 12
dt : 0.5

# traffic model weights
ckpt: ./model_ckpt/traffic_model.pth

# how to operate
feasibility_check_sep: False

# planner: 'ego' # i.e. replay
# planner: 'ego_pred' # i.e. replay
# planner: 'ego_pred_reactive' # i.e. replay
planner: 'ego_pred_agent_attention' # i.e. replay


# planner: 'hardcode' # i.e. replay



viz: True 
save: True # save the scenarios

# optimization options
num_iters: 300
lr: 0.05
# init optim
init_loss_motion_prior_ext: 0.1
init_loss_match_ext: 10.0
# adv optim
loss_coll_veh: 20.0
loss_coll_veh_plan: 20.0
loss_coll_env: 20.0
loss_init_z: 0.5
loss_init_z_atk: 0.05
loss_motion_prior: 1.0
loss_motion_prior_atk: 0.005
loss_motion_prior_ext: 0.0001
loss_match_ext: 10.0
loss_adv_crash: 2.0
# sol optim
sol_future_len: 16
sol_loss_motion_prior: 0.005
sol_loss_coll_veh: 10.0
sol_loss_coll_env: 10.0
sol_loss_motion_prior_ext: 0.001
sol_loss_match_ext: 10.0