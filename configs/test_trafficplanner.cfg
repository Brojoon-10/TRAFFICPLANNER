# TrafficPlanner Model Test Configuration (V5)

# save options
out: ./out/test_trafficplanner_out_no_tf_trans_encoder_train

# data options
data_dir: ./data/nuscenes
data_version: trainval
shuffle_test: False
batch_size: 2
num_workers: 4

# GPU device
gpu: 0

seq_interval: 5

# Sequence parameters
past_len: 4
future_len: 12
dt: 0.5

# TrafficPlannerModel architecture (must match train)
# Map token resolution: stride [2,2,1,...] → 57×57 (must match train)
conv_stride_list: [2, 2, 1, 2, 2, 2]

past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9
sur_pred_dim: 2
map_recrop: True

# Transformer decoder params (must match train)
trans_num_layers: 2
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 256
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: True

# V5 Redesign params (must match train)
use_a2a_rel_bias: True
num_z_tokens: 4
num_z_queries: 2
context_num_layers: 2
map_summary_tokens: 8
enc_dropout: 0.0

# traffic model weights
ckpt: ./out/train_trafficplanner_out_trans_encoder_no_tf/checkpoints_trafficplanner/latest_model.pth

# visualization folder suffix
viz_suffix: trans_encoder

# Potential field parameters
k_veh_repel: 1.0
sigma_veh: 0.5
k_env_boundary: 1.0
sigma_env_boundary: 0.5
k_env_solid: 0.8
sigma_env_solid: 0.5
k_env_dashed: 0.1
sigma_env_dashed: 0.3
use_lane_lines: False

#
# which evaluations to perform
#

# sampling settings
test_sample_num: 5

# reconstruction (posterior z → AR decoder)
test_recon_viz_multi: True
test_recon_coll_rate: True

# sampling (prior z → AR decoder)
test_sample_viz_multi: True
test_sample_disp_err: True
test_sample_coll_rate: True

# video generation
make_video: True
