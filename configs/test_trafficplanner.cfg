# TrafficPlanner Model Test Configuration

# save options
out: ./out/test_trafficplanner_out_tf_low_lr

# data options
data_dir: ./data/nuscenes
data_version: trainval
shuffle_test: True
batch_size: 1
num_workers: 0

# GPU device
gpu: 0

seq_interval: 100

# Sequence parameters
past_len: 4
future_len: 12
dt: 0.5

# TrafficPlannerModel architecture (same as train)
past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9
hist_attn_nhead: 4
map_attn_nhead: 4
sur_pred_dim: 2
map_recrop: True

# traffic model weights
ckpt: ./out/train_trafficplanner_out_tf_low_lr/checkpoints_trafficplanner/best_eval_model_phase1.pth

# visualization folder suffix (e.g., viz_recon_multi_<suffix>)
viz_suffix: tf

# Potential field parameters (same as train)
k_veh_repel: 1.0
sigma_veh: 1.5
k_env_boundary: 1.0
sigma_env_boundary: 0.5
k_env_solid: 0.8
sigma_env_solid: 0.5
k_env_dashed: 0.1
sigma_env_dashed: 0.3
use_lane_lines: False

#
# which evaluations to perform (in addition to computing usual losses)
#

# sampling settings
test_sample_num: 10
test_sample_future_len: 12
# sampling (qual)
test_sample_viz_multi: False
test_sample_viz_rollout: True
# sampling (quant)
test_sample_disp_err: True
test_sample_coll_rate: True
# reconstruction (qual and quant), aka inference
test_recon_viz_multi: True
test_recon_coll_rate: False

# video generation (set to True to create mp4 videos)
make_video: False
