# TrafficPlanner Model Test Configuration (V5)

# save options
out: ./out/test_v5_300ep

# data options
data_dir: ./data/nuscenes
data_version: trainval
shuffle_test: False
batch_size: 2
num_workers: 4

# GPU device
gpu: 0

seq_interval: 5

# Sequence parameters
past_len: 4
future_len: 12
dt: 0.5

# TrafficPlannerModel architecture (must match train)
past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9
sur_pred_dim: 2
map_recrop: True

# Transformer decoder params (must match train)
trans_num_layers: 2
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 256
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: True

# V5 Redesign params (must match train)
use_adaln: True
use_a2a_rel_bias: True
use_z_cross_attn: True
num_z_tokens: 4

# traffic model weights
ckpt: ./out/train_trafficplanner_out_tf_z_local_trans_z_global_enhancing/checkpoints_trafficplanner/latest_model_phase1.pth

# visualization folder suffix
viz_suffix: v5_300ep

# Potential field parameters
k_veh_repel: 1.0
sigma_veh: 0.5
k_env_boundary: 1.0
sigma_env_boundary: 0.5
k_env_solid: 0.8
sigma_env_solid: 0.5
k_env_dashed: 0.1
sigma_env_dashed: 0.3
use_lane_lines: False

#
# which evaluations to perform
#

# sampling settings
test_sample_num: 5

# reconstruction (posterior z → AR decoder)
test_recon_viz_multi: True
test_recon_coll_rate: True

# sampling (prior z → AR decoder)
test_sample_viz_multi: True
test_sample_disp_err: True
test_sample_coll_rate: True

# video generation
make_video: False
