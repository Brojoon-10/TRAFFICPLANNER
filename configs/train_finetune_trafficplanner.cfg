# TrafficPlanner Fine-tuning Configuration
# Trains ego reactive ability with adversarial scenario + solution data
# Frozen: z_global encoder + GCN + map + sur decoder components
# Trainable: ego Q/O + ego FFN + intent codebook + ego output head

# Output
out: ./out/finetune_trafficplanner_out_adv_sol_only_v4

# Loss plot
loss_plot_suffix: finetune_trafficplanner_adv_sol_only_v4

# GPU
gpu: 0

# Fine-tuning data (adv_sol_success JSON files)
scenario_dir: ./data/fine_tuning/trafficplanner_fine_tune_dataset/scenario_results/adv_sol_success

# Pre-trained checkpoint
pretrained_ckpt: ./out/train_trafficplanner_out_tf_low_lr/v4/checkpoints_trafficplanner/best_eval_model_phase1.pth

# Sequence parameters (must match pre-training)
past_len: 4
future_len: 12
dt: 0.5

# Architecture (must match pre-trained model)
past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9
sur_pred_dim: 2
map_recrop: True

# Transformer decoder params (must match pre-trained model)
trans_num_layers: 4
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 512
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: False

# Training
phase: 2
epochs: 1000
lr: 1e-5
weight_decay: 0.0

# LR cosine annealing (lr_max → lr_min over lr_anneal_epochs)
use_lr_anneal: True
lr_max: 1e-5
lr_min: 1e-6
lr_anneal_epochs: 800
batch_size: 2
num_workers: 12
val_every: 3
save_every: 10

# Loss weights
loss_recon: 1.0
loss_kl: 0.0
# loss_veh_coll_prior: 0.05 # This makes delay on training cause it needs AR
loss_veh_coll_prior: 0.0 

# Auxiliary losses
loss_sur_pred: 0.1
loss_ego_pred: 0.0
loss_intent_ce: 0.1
loss_map_attn: 0.1

# use_potential_loss: False
# loss_env_coll_prior: 0.1
# loss_potential_env: 0.0

use_potential_loss: True
loss_env_coll_prior: 0.0
loss_potential_env: 0.1

# Potential-based loss (ego-only, from pre-training config)

use_veh_potential: False
loss_potential_veh: 0.05

# Potential field parameters (from pre-training)
k_veh_repel: 1.0
sigma_veh: 0.5
k_env_boundary: 1.0
sigma_env_boundary: 0.5
k_env_solid: 0.8
sigma_env_solid: 0.5
k_env_dashed: 0.1
sigma_env_dashed: 0.3
use_lane_lines: False
env_loss_ego_only: True

# Data type selection: 'both', 'normal', 'adv_sol'
data_types: adv_sol

# Sparsity loss (disabled — not meaningful with discrete codebook)
use_sparse_loss: False

# Teacher forcing (training시 parallel forward 사용)
use_teacher_forcing: True
