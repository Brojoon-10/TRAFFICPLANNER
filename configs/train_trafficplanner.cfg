# TrafficPlanner Model Training Configuration
# Phase 1: Pre-training with z_global
# Phase 2: Fine-tuning with z_local (frozen z_global)

# save options
out: ./out/train_trafficplanner_out_tf_z_local_trans_z_global_enhancing_debugged

# Loss plot suffix (saved as loss_<suffix>.jpg)
loss_plot_suffix: trafficplanner_tf_z_local_trans_z_global_enhancing_debugged

# GPU device
gpu: 0

# data options
data_dir: ./data/nuscenes
data_version: trainval
data_noise_std: 0.01

batch_size: 2
num_workers: 12

seq_interval: 5 # for sub seq

# Sequence parameters
past_len: 4
future_len: 12
dt: 0.5

# TrafficPlannerModel architecture
# Map token resolution: stride [2,2,2,...] → 29×29, stride [2,2,1,...] → 57×57
# conv_stride_list: [2, 2, 2, 2, 2, 2] # 29×29
conv_stride_list: [2, 2, 1, 2, 2, 2] # 57×57

past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9 # number of intent codebook entries (3acc × 3yaw)
sur_pred_dim: 2 # dx, dy

# Map re-crop: re-crop map tokens at each decode step (follows agent movement)
# False: use initial crop throughout (faster, ~22m movement within 64m crop)
# True: re-crop every step (accurate but slower, must match at train/deploy)
map_recrop: True 

# Phase-based training
# phase: 1 for pre-training, 2 for fine-tuning
phase: 1
# phase1_ckpt: ./out/train_trafficplanner_out/checkpoints_trafficplanner/best_eval_model_phase1.pth

# Resume from checkpoint
# ckpt: ./out/train_trafficplanner_out_tf_new_model/checkpoints_trafficplanner/latest_model_phase1.pth

# optim and loss
epochs: 300

# LR step-based cosine annealing with warmup
# warmup: 0 → lr_max linear over warmup_steps
# decay:  lr_max → lr_min cosine over remaining steps

use_lr_anneal: True
lr_max: 3e-4
lr_min: 5e-6
lr_warmup_steps: 2500
# lr_total_steps: auto-estimated from epochs * (data_size / batch_size)

loss_kl: 0.004
kl_anneal_end: 30
loss_recon: 1.0
# loss_veh_coll_prior: 0.05
loss_veh_coll_prior: 0.0 # This makes delay on training cause it needs AR


# Potential-based loss (ego-only)
# Target: ~10% of recon_loss (3.8) → veh ~0.4%, env ~9%


# use_potential_loss: False
# loss_potential_veh: 0.0
# loss_potential_env: 0.0
# loss_env_coll_prior: 0.1

use_potential_loss: True
loss_potential_veh: 0.0
loss_potential_env: 0.1
loss_env_coll_prior: 0.0


use_veh_potential: False


# Potential field parameters
# Assuming lane width = 3.5m, center-to-boundary = 1.75m
# Goal: potential ≈ 0.05 at lane center, strong near boundary

# Vehicle repulsion (vehicle length ~4-5m)
k_veh_repel: 1.0
sigma_veh: 0.5       

# Road boundary (non-drivable area) - strongest
k_env_boundary: 1.0
sigma_env_boundary: 0.5   # at 1.75m: 0.03, at 0.5m: 0.37

# Solid line (no lane change) - slightly weaker than boundary
k_env_solid: 0.8
sigma_env_solid: 0.5      # at 1.75m: 0.024, at 0.5m: 0.29

# Dashed line (lane change OK) - weak
k_env_dashed: 0.1
sigma_env_dashed: 0.3     # at 1.75m: 0.003, at 0.5m: 0.02

use_lane_lines: False

# Apply env potential loss to ego only (True) or all agents (False)
env_loss_ego_only: True

# z_local sparsity loss (off by default for Phase 1)
# Enable in Phase 2 if needed
use_sparse_loss: False
loss_sparse: 0.01
target_sparsity: 0.1

# Teacher forcing (training시 parallel forward 사용)
use_teacher_forcing: True

# Auxiliary loss weights (Redesign)
# Sur Pred: ego_hist_ctx → predicted sur delta
loss_sur_pred: 0.1
# Ego Pred: sur_hist_ctx → predicted ego delta
loss_ego_pred: 0.1
# Intent CE: z_local → 9-class
loss_intent_ce: 0.05
intent_range: 2.0
# Map Attn Guidance: attention weight KL vs GT lookahead soft label
loss_map_attn: 0.05
map_gt_steps: 6
map_gt_decay_lambda: 0.3
# Map attn cosine annealing: step-based (steps > 0 overrides epoch-based)
map_attn_anneal: True
map_attn_anneal_epochs: 300
map_attn_anneal_steps: 62500

# ============================================
# Transformer Decoder Parameters
# ============================================
trans_num_layers: 2
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 256
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: True

# ============================================
# V5 Redesign Parameters
# ============================================
use_adaln: True
use_a2a_rel_bias: True
use_z_cross_attn: True
num_z_tokens: 4
loss_z_aux: 0.1
recon_pos_weight: 10

# Action Blending (TF→AR bridge)
action_blending: True
blend_start_step: 10000
blend_anneal_steps: 65000
blend_target_alpha: 1.0

