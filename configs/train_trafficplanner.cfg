# TrafficPlanner Model Training Configuration
# Phase 1: Encoder pre-training (z_aux + map_dist_aux + KL)
# Phase 2: Frozen encoder + fresh decoder (recon + intent_ce + dist_aux)

# save options
out: ./out/train_trafficplanner_out_trans_encoder_no_tf

# Loss plot suffix (saved as loss_<suffix>.jpg)
loss_plot_suffix: trafficplanner_trans_encoder_no_tf

# GPU device
gpu: 0

# data options
data_dir: ./data/nuscenes
data_version: trainval
data_noise_std: 0.00

# scenario_dir: ./data/race_scenarios/various_driving_data_20260224
batch_size: 2
num_workers: 12

seq_interval: 1 # for sub seq

# Sequence parameters
past_len: 4
future_len: 12
dt: 0.5

# TrafficPlannerModel architecture
# Map token resolution: stride [2,2,2,...] -> 29x29, stride [2,2,1,...] -> 57x57
# conv_stride_list: [2, 2, 2, 2, 2, 2] # 29x29
conv_stride_list: [2, 2, 1, 2, 2, 2] # 57x57

past_feat_size: 64
future_feat_size: 64
latent_size: 32
z_local_size: 32

# Decoder params
num_intents: 9 # number of intent codebook entries (3acc x 3yaw)
sur_pred_dim: 2 # dx, dy

# Map re-crop: re-crop map tokens at each decode step (follows agent movement)
map_recrop: True

# ============================================
# Phase-based training
# ============================================
# phase: 1 for encoder pre-training, 2 for decoder fine-tuning
phase: 1
# Phase 2 시 Phase 1 checkpoint 경로 지정
# phase1_ckpt: ./out/train_trafficplanner_out_trans_encoder_no_tf/checkpoints_trafficplanner/best_eval_model.pth

# Resume from checkpoint (same phase 내 재개)
# ckpt: ./out/.../latest_model.pth

# ============================================
# Optimizer & LR Schedule
# ============================================
epochs: 30

# LR step-based cosine annealing with warmup
use_lr_anneal: True
lr_max: 3e-4
lr_min: 5e-6
lr_warmup_steps: 2629

# ============================================
# Phase 1 Loss Weights
# ============================================
# Phase 1: encoder 학습 — z_aux + map_dist_aux + KL만 활성
loss_recon: 0.0
loss_kl: 0.001
kl_anneal_steps: 0
kl_floor: 0.0
kl_free_bits: 0.0

# Phase 1 auxiliary heads
loss_z_aux: 0.5
loss_map_dist_aux: 0.1

# Phase 2 전용 (Phase 1에서는 0)
loss_intent_ce: 0.0
loss_dist_aux: 0.0

# Encoder PE dropout (0.0 = off)
enc_dropout: 0.0

# Auxiliary loss weights
loss_sur_pred: 0.0
loss_ego_pred: 0.0
intent_range: 2.0

# Map Attn Guidance (Phase 1에서는 비활성)
loss_map_attn: 0.0
map_gt_steps: 6
map_gt_decay_lambda: 0.075
map_attn_anneal: False

# Potential-based loss (Phase 1에서는 비활성)
use_potential_loss: False
loss_potential_veh: 0.0
loss_potential_env: 0.0
loss_veh_coll_prior: 0.0
loss_env_coll_prior: 0.0
use_veh_potential: False

k_veh_repel: 1.0
sigma_veh: 0.5
k_env_boundary: 1.0
sigma_env_boundary: 0.5
k_env_solid: 0.8
sigma_env_solid: 0.5
k_env_dashed: 0.1
sigma_env_dashed: 0.3
use_lane_lines: False
env_loss_ego_only: True

# z_local sparsity (Phase 1에서 비활성)
use_sparse_loss: False
loss_sparse: 0.0

# Teacher forcing / Action blending (Phase 1에서 불필요)
use_teacher_forcing: False
action_blending: False

recon_pos_weight: 1

# ============================================
# Transformer Decoder Parameters
# ============================================
trans_num_layers: 2
trans_d_model: 128
trans_nhead: 8
trans_ffn_dim: 256
trans_dropout: 0.1
use_ego_z_local: True
use_sur_z_local: True

# ============================================
# S1-S4 Redesign Parameters
# ============================================
use_a2a_rel_bias: True
# S4: z_query 4개 (z_gen cross-attention)
num_z_queries: 4
context_num_layers: 2
map_summary_tokens: 8
